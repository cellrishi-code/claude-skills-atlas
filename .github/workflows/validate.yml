name: Validate Atlas

on:
  push:
    paths: ["skills/**","prompts/**","workflows/**","agents/**","templates/**","scripts/**","CATALOG.md","tests/**"]
  pull_request:
    paths: ["skills/**","prompts/**","workflows/**","agents/**","templates/**","scripts/**","CATALOG.md","tests/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate resources and catalog
        run: python scripts/validate_atlas.py
      - name: Run tests
        run: python -m unittest discover tests
      - name: Verify generated registry is synchronized
        run: |
          python scripts/generate_registry.py
          git diff --exit-code -- registry.json
